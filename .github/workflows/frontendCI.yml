name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write 

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: surrey-foodbank/frontend
    steps:
      - uses: actions/checkout@v4  

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: surrey-foodbank/frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: surrey-foodbank/backend

      - name: Run backend integration tests
        run: npm test
        working-directory: surrey-foodbank/backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_STAFF_BASE: ${{ secrets.VITE_STAFF_BASE }}
          VITE_STAFF_USER: ${{ secrets.VITE_STAFF_USER }}
          VITE_STAFF_PASS: ${{ secrets.VITE_STAFF_PASS }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy backend
        if: github.ref == 'refs/heads/main'
        run: curl -fsS -X POST "$BACKEND_DEPLOY_HOOK_URL"
        env:
          BACKEND_DEPLOY_HOOK_URL: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./surrey-foodbank/frontend/dist