name: Frontend CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write 

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: surrey-foodbank/frontend
    steps:
      - uses: actions/checkout@v4  

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: surrey-foodbank/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_STAFF_BASE: ${{ secrets.VITE_STAFF_BASE }}
          VITE_STAFF_USER: ${{ secrets.VITE_STAFF_USER }}
          VITE_STAFF_PASS: ${{ secrets.VITE_STAFF_PASS }}

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./surrey-foodbank/frontend/dist